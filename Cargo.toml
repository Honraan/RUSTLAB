[package]
name = "rustlab"
version = "0.3.2"
edition = "2024"
description = "RustLab — ambiente terminal para aprender Rust com lições, exercícios e mini-IDE"
license = "GPL-3.0-only"

[dependencies]
# Mesmo algoritmo do renderer para contar linhas quebradas nos painéis roláveis.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tachyonfx = "0.25"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "sync", "macros"] }

# O tom de XP usa paplay em runtime, sem dependências nativas no build.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
