[workspace]
members = [".", "apps/desktop/src-tauri"]
default-members = ["."]
resolver = "2"

[package]
name = "rustlab"
version = "0.3.2"
edition = "2024"
description = "RustLab — ambiente terminal para aprender Rust com lições, exercícios e mini-IDE"
license = "GPL-3.0-only"

[dependencies]
# Mesmo algoritmo do renderer para contar linhas quebradas nos painéis roláveis.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tachyonfx = "0.25"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

# O tom de XP usa paplay em runtime, sem dependências nativas no build.

[dev-dependencies]
