[package]
name = "rustlab-desktop"
version = "4.0.0"
description = "RustLab 4.0 — Ambiente Desktop Windows para aprender e criar com Rust"
authors = ["RustLab Contributors"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "rustlab_desktop_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustlab = { path = "../../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
keyring = { version = "3", features = ["windows-native"] }
