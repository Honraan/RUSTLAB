name: Release Windows V4

on:
  push:
    tags:
      - 'v4.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSVC + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify frontend & build assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Verify formatting, Clippy & workspace tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Optional Authenticode signing (only if secrets configured)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            Write-Host "::notice::Nenhum certificado Windows configurado. O instalador será publicado sem assinatura EV (SmartScreen pode exibir aviso até ganhar reputação)."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe não encontrado no runner Windows." }
          Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($_.Name)" }
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $nsisDir = "target/release/bundle/nsis"
          Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "$nsisDir/SHA256SUMS" -Encoding utf8

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v4.')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS
          body_path: docs/V4_RELEASE_NOTES.md
