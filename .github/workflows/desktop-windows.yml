name: Desktop Windows
on:
  push:
    branches: ['codex/rustlab-v4-windows']
    paths: ['apps/desktop/**', 'src/**', 'Cargo.*', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['apps/desktop/**', 'src/**', 'Cargo.*', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Verificar TUI Classic e executor
        run: |
          cargo check --locked --all-targets
          cargo test --locked --test cargo_run --test project_flow --test exercise_flow
          cargo test --locked --lib conpty_cargo_uses_a_console_and_delivers_keyboard_input
      - name: Instalar dependências da interface
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Testar integração desktop e formatação
        run: |
          npm --prefix apps/desktop run build
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          $env:RUSTLAB_CAPSTONE_QA_DIR = Join-Path $env:RUNNER_TEMP RustLabCapstones
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Gerar instalador NSIS x64
        working-directory: apps/desktop
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Gerar hashes e reunir arquivos
        run: |
          $setups = @(Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($setups.Count -eq 0) { throw 'Instalador NSIS ausente.' }
          New-Item -ItemType Directory windows-artifact
          $setups | Copy-Item -Destination windows-artifact
          Copy-Item LICENSE -Destination windows-artifact
          $setups | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content windows-artifact/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Testar instalação, abertura e desinstalação
        run: |
          $setup = Get-ChildItem windows-artifact/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP RustLabSmoke
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Falha do instalador: $($install.ExitCode)" }
          $appPath = Join-Path $destination 'rustlab-desktop.exe'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $app = Start-Process $appPath -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "RustLab encerrou com código $($app.ExitCode)" }
              if ($app.MainWindowTitle -eq 'RustLab') { $opened = $true; break }
            }
            if (-not $opened) { throw 'A janela RustLab não apareceu.' }
            node apps/desktop/tests/windows-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao validar a interface instalada.' }
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          Start-Sleep -Seconds 2
          $app = Start-Process $appPath -PassThru
          try {
            node apps/desktop/tests/windows-smoke.mjs --restored
            if ($LASTEXITCODE -ne 0) { throw 'O progresso não persistiu após reabrir o app.' }
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          $uninstall = Start-Process (Join-Path $destination 'uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $destination 'rustlab-desktop.exe'))) {
            throw 'A desinstalação falhou.'
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rustlab-desktop-windows-x64
          path: windows-artifact
          if-no-files-found: warn
      - name: Validar modelos gráficos no Windows
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_INCREMENTAL: 0
        run: |
          $root = Join-Path $env:RUNNER_TEMP RustLabCapstones
          $paint = Join-Path $root mini_paint
          $cave = Join-Path $root cavegame
          cargo test --manifest-path "$paint/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw 'Falha dos testes de Mini Paint.' }
          cargo build --locked --manifest-path "$paint/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar Mini Paint.' }
          $gui = Start-Process (Join-Path $paint 'target/debug/mini_paint.exe') -WorkingDirectory $paint -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $gui.Refresh()
              if ($gui.HasExited) { throw "Mini Paint encerrou com código $($gui.ExitCode)." }
              if ($gui.MainWindowTitle -like 'Mini Paint*') { $opened = $true; break }
            }
            if (-not $opened) { throw 'A janela nativa Mini Paint não abriu.' }
          } finally {
            if (-not $gui.HasExited) {
              $null = $gui.CloseMainWindow()
              if (-not $gui.WaitForExit(10000)) { Stop-Process -Id $gui.Id -Force }
            }
          }
          cargo check --manifest-path "$cave/Cargo.toml" --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Falha na verificação MSVC do CaveGame.' }
