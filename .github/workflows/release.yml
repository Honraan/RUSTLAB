name: Release Linux
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Conferir versão da tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag e versão divergem'
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 tests/tui_phase4.py target/release/rustlab
      - run: python3 tests/tui_phase6.py target/release/rustlab
      - name: Empacotar
        run: |
          mkdir rustlab-linux-x86_64
          cp target/release/rustlab README.md LICENSE rustlab-linux-x86_64/
          tar -czf rustlab-linux-x86_64.tar.gz rustlab-linux-x86_64
          sha256sum rustlab-linux-x86_64.tar.gz > SHA256SUMS
      - name: Publicar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" rustlab-linux-x86_64.tar.gz SHA256SUMS --draft --verify-tag --generate-notes
