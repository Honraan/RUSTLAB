id = "soma-quadrados-pares"
order = 120
lesson_ids = ["genericos-e-closures", "iteradores-e-arquivos"]
title = "Soma dos quadrados pares"
statement = "Implemente soma_quadrados_pares(nums: &[i32]) -> i32 calculando a soma dos quadrados apenas dos números pares presentes em `nums`. Ex.: &[1, 2, 3, 4] -> 2² + 4² = 20."
skeleton = '''pub fn soma_quadrados_pares(nums: &[i32]) -> i32 {
    todo!("filtre os pares, eleve ao quadrado e some")
}
'''
tests = '''#[cfg(test)]
mod tests {
    use super::soma_quadrados_pares;

    #[test]
    fn pares_positivos_e_negativos() {
        assert_eq!(soma_quadrados_pares(&[1, 2, 3, 4]), 20);
        assert_eq!(soma_quadrados_pares(&[-2, -3, 0, 5]), 4);
    }

    #[test]
    fn vazio_ou_so_impares() {
        assert_eq!(soma_quadrados_pares(&[]), 0);
        assert_eq!(soma_quadrados_pares(&[1, 3, 5]), 0);
    }
}
'''
hints = [
  "Você pode usar um `for &n in nums` ou encadear iteradores `.iter().copied()`.",
  "Um número é par quando `n % 2 == 0` (funciona também para pares negativos e zero).",
  "Eleve ao quadrado com `.map(|n| n * n)` e some tudo com `.sum()`.",
  "Solução: nums.iter().copied().filter(|n| n % 2 == 0).map(|n| n * n).sum()",
]
